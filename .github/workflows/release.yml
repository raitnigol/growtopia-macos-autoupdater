name: Test, build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Checks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Record runner environment
        run: |
          sw_vers
          uname -m
          /bin/bash --version
          python3 --version
          node --version
      - name: Validate release source inputs
        run: python3 scripts/build_macos.py --validate-only
      - name: Worker and installer checks under macOS Bash
        env:
          GROWTOPIA_TEST_BASH: /bin/bash
        run: python3 -m unittest discover -s tests -v
      - name: Release-script checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: UI logic and JavaScript syntax
        run: |
          node --check Resources/ui.js
          node tests/test_ui_model.cjs
      - name: Compile UI sources without launching the interface
        run: |
          for source in Resources/*.js; do
            name="$(basename "$source" .js)"
            osacompile -l JavaScript -o "$RUNNER_TEMP/$name.scpt" "$source"
          done
          osacompile -o "$RUNNER_TEMP/launcher-dialogs.scpt" Resources/dialogs.applescript
          for source in Resources/*.sh scripts/*.sh; do
            /bin/bash -n "$source"
          done
      - name: Exercise the native macOS Trash API on a temporary test file
        run: |
          test_dir="$(mktemp -d "$RUNNER_TEMP/growtopia-trash-smoke.XXXXXXXX")"
          test_file="$test_dir/Growtopia.dmg"
          printf 'Cleanup API smoke test; this is not a game installer.\n' > "$test_file"
          osascript -l JavaScript Resources/trash-file.js "$test_file"
          test ! -e "$test_file"
          rmdir "$test_dir"

  build:
    name: Build universal application
    needs: test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and ad-hoc sign the complete application bundle
        run: python3 scripts/build_macos.py --commit "$GITHUB_SHA"
      - name: Open and close the packaged AppKit UI without installing or launching the game
        run: python3 scripts/smoke_test_macos.py
      - name: Verify packaged archive checksum
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-${{ github.sha }}
          path: |
            dist/growtopia-launcher-macos-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish version if it does not exist
    needs: build
    if: >-
      github.repository == 'raitnigol/growtopia-macos-autoupdater' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release-${{ github.sha }}
          path: dist
      - name: Publish release and its verified assets from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
